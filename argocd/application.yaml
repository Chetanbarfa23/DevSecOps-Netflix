apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netflix
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Chetanbarfa23/DevSecOps-Netflix.git
    targetRevision: main
    path: Kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
